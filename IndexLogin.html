<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Pragati Classes</title>
  <link rel="stylesheet" href="styleLogin.css">
</head>
<body>
  <main class="wrap">
    <section class="intro">
      <h2>WELCOME TO PRAGATI CLASSES</h2>
      <p>Log in to access your classes, study material and test results. Keep learning, keep growing.</p>
    </section>

    <section class="card">
      <h3>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        LOGIN HERE
      </h3>

      <form id="loginForm" novalidate>
        <div class="field">
          <input type="tel" name="phone" placeholder="Phone Number" aria-label="Phone number" required>
        </div>
        <!-- <div class="field">
          <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        </div> -->
        <div class="field">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        </div>

        <div class="row">
          <label><input type="checkbox" id="remember"> Remember me</label>
          <!-- <a href="#">Forgot password?</a> -->
           <a href="Forgot.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Login</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
      <p class="switch">New here? <a href="Index.html">Register now</a></p>
    </section>
  </main>

  <script>
   
const loginForm = document.getElementById("loginForm");
const loginMsg = document.getElementById("msg");

loginForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const rememberCheckbox = document.getElementById("remember");

if (!rememberCheckbox.checked) {
    event.preventDefault();
    loginMsg.style.color = "#ffb3b3";
    loginMsg.textContent = "Please tick Remember me before login.";
    rememberCheckbox.focus();
    return;
}

    const phone = loginForm.elements["phone"].value.trim();
    const password = document.getElementById("password").value;
//     //if (!remember) {
//     loginMsg.textContent = "Please tick Remember me before login.";
//     document.getElementById("remember").focus();
//     return;
// }

    if (!/^[0-9]{10}$/.test(phone)) {
        loginMsg.textContent = "Enter a valid 10-digit phone number.";
        loginForm.elements["phone"].focus();
        return;
    }

    if (!password || password.length < 6) {
        loginMsg.textContent = "Password must be at least 6 characters.";
        document.getElementById("password").focus();
        return;
    }

    try {
        const students = JSON.parse(
            localStorage.getItem("pragatiStudents") || "[]"
        );

        const student = students.find(function (item) {
            return item.phone === phone && item.password === password;
        });

        if (!student) {
            loginMsg.textContent =
                "Invalid phone number or password. Please register first.";
            return;
        }

        const loggedInStudent = {
            name: student.name,
            email: student.email,
            phone: student.phone,
            course: student.course
        };

        // Clear an earlier login from both storage locations.
        localStorage.removeItem("pragatiLoggedInStudent");
        sessionStorage.removeItem("pragatiLoggedInStudent");

        // Remember me controls how long this demo login is retained.
        const storage = rememberCheckbox.checked ? localStorage : sessionStorage;

        storage.setItem(
            "pragatiLoggedInStudent",
            JSON.stringify(loggedInStudent)
        );

        loginMsg.style.color = "#2fe09b";
        loginMsg.textContent = "Login successful! Opening dashboard...";

        loginForm.querySelector('button[type="submit"]').disabled = true;

        setTimeout(function () {
            window.location.href = "dashboard.html";
        }, 700);

    } catch (error) {
        loginMsg.style.color = "#ffb3b3";
        loginMsg.textContent =
            "Something went wrong. Please try again.";
    }
});

  </script>
</body>
</html>
