<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e3a7a" />
      <stop offset="60%" stop-color="#0f2252" />
      <stop offset="100%" stop-color="#081333" />
    </radialGradient>

    <!-- Doodle Stroke Style -->
    <style>
      .doodle { fill: none; stroke: rgba(255, 255, 255, 0.15); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .doodle-text { fill: rgba(255, 255, 255, 0.2); font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; }
      .logo-white { fill: #FFFFFF; font-family: 'Arial Black', Gadget, sans-serif; font-size: 38px; font-weight: 900; }
      .logo-orange { fill: #FF9F1C; font-family: 'Arial Black', Gadget, sans-serif; font-size: 38px; font-weight: 900; }
      .sub-text { fill: #A0AEC0; font-family: Arial, sans-serif; font-size: 14px; letter-spacing: 3px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)" />

  <!-- ================= TOP HEADER / LOGO ================= -->
  <g transform="translate(60, 60)">
    <text x="0" y="35" class="logo-white">Pragati</text>
    <text x="160" y="35" class="logo-orange">Classes</text>
    <line x1="0" y1="48" x2="35" y2="48" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round" />
    <text x="45" y="52" class="sub-text">SEMRA BAZAR</text>
  </g>

  <!-- ================= BACKGROUND DOODLES & FORMULAS ================= -->

  <!-- Top Left: Math Formulas -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" class="doodle-text" font-size="28">a² + b² = c²</text>
  </g>

  <!-- Top Center-Left: A + B = C -->
  <g transform="translate(550, 110)">
    <text x="0" y="0" class="doodle-text" font-size="32">A + B = C</text>
    <path d="M -10 15 Q 40 30 80 15 T 180 15" class="doodle" />
  </g>

  <!-- Top Right: E = mc² -->
  <g transform="translate(1200, 120)">
    <text x="0" y="0" class="doodle-text" font-size="38">E = mc²</text>
  </g>

  <!-- Right Side: Sigma Symbol -->
  <g transform="translate(1650, 260)">
    <text x="0" y="0" class="doodle-text" font-size="110">∑</text>
  </g>

  <!-- Center Top: Light Bulb -->
  <g transform="translate(930, 240)">
    <!-- Bulb outline -->
    <path d="M 0 0 A 40 40 0 1 1 50 0 C 50 15 40 25 38 35 L 12 35 C 10 25 0 15 0 0 Z" class="doodle" />
    <!-- Filament -->
    <path d="M 18 10 L 25 -5 L 32 10" class="doodle" />
    <!-- Base & Screw Threads -->
    <line x1="12" y1="42" x2="38" y2="42" class="doodle" />
    <line x1="15" y1="49" x2="35" y2="49" class="doodle" />
    <path d="M 20 55 C 20 60 30 60 30 55 Z" class="doodle" />
  </g>

  <!-- Mid-Left: Right Triangle -->
  <g transform="translate(120, 280)">
    <polygon points="0,150 180,150 0,20" class="doodle" />
    <rect x="0" y="132" width="18" height="18" class="doodle" />
  </g>

  <!-- Bottom-Left: Graph & Pi -->
  <g transform="translate(100, 540)">
    <text x="0" y="40" class="doodle-text" font-size="45">π</text>
    <!-- Axis & Sine Wave -->
    <path d="M 60 180 L 60 20 L 320 20" class="doodle" />
    <path d="M 60 180 Q 120 40 180 110 T 300 50" stroke="rgba(255,159,28,0.3)" stroke-width="3" fill="none" />
  </g>

  <!-- Bottom-Left Math: sin²θ + cos²θ = 1 -->
  <g transform="translate(320, 800)">
    <text x="0" y="0" class="doodle-text" font-size="30">sin²θ + cos²θ = 1</text>
  </g>

  <!-- Bottom Center: Open Book -->
  <g transform="translate(900, 600)">
    <path d="M -120 120 Q -60 90 0 110 Q 60 90 120 120 L 120 0 Q 60 -30 0 -10 Q -60 -30 -120 0 Z" class="doodle" />
    <line x1="0" y1="-10" x2="0" y2="110" class="doodle" />
  </g>

  <!-- Bottom Center Math: x² - 5x + 6 = 0 -->
  <g transform="translate(750, 830)">
    <text x="0" y="0" class="doodle-text" font-size="32">x² - 5x + 6 = 0</text>
  </g>

  <!-- Right Side: Atom Structure -->
  <g transform="translate(1600, 540)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="80" ry="30" class="doodle" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="80" ry="30" class="doodle" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="80" ry="30" class="doodle" transform="rotate(120)" />
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="6" fill="rgba(255, 159, 28, 0.6)" />
  </g>

  <!-- Bottom Right Math: √49 = 7 -->
  <g transform="translate(1550, 700)">
    <text x="0" y="0" class="doodle-text" font-size="34">√49 = 7</text>
  </g>

  <!-- Bottom Right Chemistry: H₂O -->
  <g transform="translate(1350, 820)">
    <text x="0" y="0" class="doodle-text" font-size="30">H₂O</text>
  </g>

  <!-- ================= BOTTOM ORANGE BAR ================= -->
  <g transform="translate(0, 1020)">
    <!-- Orange Strip -->
    <rect width="1920" height="60" fill="#FF7A00" />
    <!-- Decorative Right Buttons -->
    <rect x="1500" y="15" width="90" height="30" rx="15" fill="#FFFFFF" />
    <rect x="1610" y="15" width="40" height="30" rx="15" fill="rgba(255,255,255,0.7)" />
  </g>
</svg>